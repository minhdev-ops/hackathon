name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.2 (kèm pdo_sqlite — issue 11)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo, pdo_sqlite, sqlite3, tokenizer, xml, zip
          coverage: none

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Chuẩn bị .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Chạy PHPUnit (sqlite :memory: — shell env thắng phpunit.xml)
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: php artisan test

      - name: Kiểm tra code style (Pint)
        run: vendor/bin/pint --test

  frontend:
    name: Frontend (build + unit test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: Unit test (node --test)
        run: npm run test:js

      - name: Vite build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: trustgate_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, dom, fileinfo, mbstring, openssl, pdo, pdo_mysql, tokenizer, xml, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Composer + npm install
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build frontend (manifest cho Blade @vite)
        run: npm run build

      - name: Cài trình duyệt Playwright
        run: npx playwright install --with-deps chrome || npx playwright install --with-deps chromium

      - name: Chạy E2E (playwright tự boot server qua scripts/e2e-server.sh, DB trustgate_e2e)
        env:
          CI: 'true'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          export APP_KEY="base64:$(head -c 32 /dev/urandom | base64)"
          npm run test:e2e
